name: קישורי שותפים למוצרים חדשים (ממתינים לאישור)

on:
  push:
    branches: [main]
    paths: ['links.request']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: יצירת קישורים
        env:
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
        run: python scripts/make_links.py
      - name: שמירה (המוצרים עדיין מוסתרים)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "קישורי שותפים למוצרים ממתינים" || exit 0
          git pull --rebase
          git push
