name: עדכון שער דולר

on:
  schedule:
    - cron: '30 13 * * 0-4'   # ראשון עד חמישי, אחרי פרסום השער היציג
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/rate.py
      - name: שמירה
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/rate.json
          git commit -m "עדכון שער דולר" || exit 0
          git pull --rebase
          git push
